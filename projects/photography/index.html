      <!-- The photos come straight from the photos/ folder next to this
           page. Add images there and push: they appear automatically.
           Dates come from photo-info.js. See photos/README.md. -->
      <div class="puzzle" id="photos" aria-live="polite" style="margin-top: 2rem"></div>

    <script src="photo-info.js"></script>
    <script>
      (async () => {
        const box = document.getElementById("photos");
        const fmt = (iso) =>
          new Date(`${iso}T12:00:00`).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
        let files = [];
        try {
          files = await TH45.listFolder("projects/photography/photos", [".jpg", ".jpeg", ".png", ".webp", ".gif"]);
        } catch {
          box.replaceWith(TH45.el("p", { class: "empty-note", text: "The photographs couldn't load right now. Please refresh in a minute." }));
          return;
        }
        if (!files.length) {
          box.replaceWith(TH45.el("p", { class: "empty-note", text: "Photographs coming soon." }));
          return;
        }

        // the small grid version lives in photos/thumbs/ (same name, .webp);
        // photos without one simply use the full image
        const base = (f) => f.replace(/\.[^.]+$/, "");
        const items = files.map((f) => {
          const info = PHOTO_INFO[base(f)] || {};
          return {
            file: f,
            date: info.date || "",
            w: info.w,
            h: info.h,
            thumb: `photos/thumbs/${encodeURIComponent(base(f))}.webp`,
            full: `photos/${encodeURIComponent(f)}`,
            title: info.date ? `Taken ${fmt(info.date)}` : TH45.titleFromFile(f),
            caption: [info.date ? fmt(info.date) : "", info.camera].filter(Boolean).join(" · "),
          };
        });

        // photos with no known size: measure them first
        await Promise.all(
          items.filter((i) => !i.w || !i.h).map(
            (i) =>
              new Promise((done) => {
                const img = new Image();
                img.onload = () => { i.w = img.naturalWidth; i.h = img.naturalHeight; done(); };
                img.onerror = () => { i.w = 3; i.h = 2; done(); };
                img.src = i.full;
              }),
          ),
        );

        // newest first (photos without a date go first, as the newest uploads)
        items.sort((a, b) => (b.date || "9999").localeCompare(a.date || "9999") || a.file.localeCompare(b.file));

        // show the date in the hover caption instead of a title
        const grid = items.map((i) => ({ ...i, title: i.date ? fmt(i.date) : i.title, year: "" }));
        TH45.imagePuzzle(box, grid, (n) => TH45.viewer.images(items, n));

        // if a photo has no small version yet, fall back to the full image
        box.addEventListener("error", (e) => {
          const img = e.target;
          if (img.tagName === "IMG" && img.src.includes("/thumbs/")) {
            img.src = items.find((i) => img.src.endsWith(i.thumb.split("/").pop()))?.full || img.src;
          }
        }, true);
      })();
    </script>
