      <!-- The photos come straight from the photos/ folder next to this
           page. Add images there and push: they appear automatically,
           newest file name first. See photos/README.md. -->
      <div class="masonry" id="photos" aria-live="polite"></div>

    <script src="../shared/sections.js"></script>
    <script>
      (async () => {
        const box = document.getElementById("photos");
        let files = [];
        try {
          files = await TH45.listFolder("projects/photography/photos", [".jpg", ".jpeg", ".png", ".webp", ".gif"]);
        } catch {
          box.replaceWith(TH45.el("p", { class: "empty-note", text: "The photographs couldn't load right now. Please refresh in a minute." }));
          return;
        }
        if (!files.length) {
          box.replaceWith(TH45.el("p", { class: "empty-note", text: "Photographs coming soon." }));
          return;
        }
        files.sort().reverse();
        const items = files.map((f) => ({ title: TH45.titleFromFile(f), full: `photos/${encodeURIComponent(f)}` }));
        box.replaceChildren(
          ...items.map((item, i) =>
            TH45.el(
              "button",
              { class: "tile", type: "button", "aria-label": `Open ${item.title}`, onclick: () => TH45.viewer.images(items, i) },
              TH45.el("img", { src: item.full, alt: item.title, loading: "lazy", decoding: "async" }),
              TH45.el("span", { class: "tile-caption" }, TH45.el("b", { text: item.title })),
            ),
          ),
        );
      })();
    </script>
