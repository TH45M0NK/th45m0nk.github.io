    <script>
      // Once there are photographs, show how many on the Photography corner.
      TH45.listFolder("projects/photography/photos", [".jpg", ".jpeg", ".png", ".webp", ".gif"])
        .then((files) => {
          if (!files.length) return;
          const label = document.querySelector(".t-photo .hex-label");
          label.append(TH45.el("small", { text: `${files.length} photograph${files.length > 1 ? "s" : ""}` }));
        })
        .catch(() => {});
